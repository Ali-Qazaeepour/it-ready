<script>const DATA={"kind":"defender","title":"Antivirus & Security","faTitle":"آنتی ویروس و امنیت ویندوز","sub":"Check Windows Security, firewall and threat history using your Windows 11 screens.","faSub":"بررسی امنیت ویندوز، فایروال و سابقه تهدیدها با تصاویر واقعی ویندوز ۱۱","reportTitle":"IT READY — WINDOWS SECURITY CHECK","steps":[{"en":"Security at a glance","fa":"نمای کلی امنیت","img":0,"page":"Windows 11","action":"Open Start → Windows Security → Home. Look for red crosses or yellow warnings. The example shows protection OFF. If you see these warnings on your PC, contact IT promptly; do not change any settings.","faAction":"از Start برنامه Windows Security را باز کنید و به Home بروید. ضربدر قرمز و هشدار زرد را بررسی کنید. در این تصویر حفاظت خاموش است. اگر این هشدارها را روی دستگاه خود می‌بینید، سریعاً به IT اطلاع دهید و هیچ تنظیمی را تغییر ندهید.","optional":false},{"en":"Virus & threat protection","fa":"حفاظت در برابر ویروس","img":1,"page":"Windows 11","action":"Open Virus & threat protection. Check both “No current threats” and the section below: “Virus & threat protection settings”. This example shows real-time protection OFF. Report that to IT; do not press Turn on without instructions.","faAction":"بخش Virus & threat protection را باز کنید. هم «No current threats» و هم بخش «Virus & threat protection settings» را بررسی کنید. در تصویر، Real-time protection خاموش است. به IT گزارش دهید و بدون راهنمایی گزینه Turn on را نزنید.","optional":false},{"en":"Account protection","fa":"امنیت حساب کاربری","img":2,"page":"Windows 11","action":"Select Account protection and check for warnings. “Not signed in with Microsoft” may be normal on a managed work PC. Do not add your personal account.","faAction":"Account protection را باز کنید و هشدارها را بررسی کنید. پیام «Not signed in with Microsoft» ممکن است در سیستم سازمانی عادی باشد. حساب شخصی اضافه نکنید.","optional":false},{"en":"Firewall & network protection","fa":"فایروال و حفاظت شبکه","img":3,"page":"Windows 11","action":"Open Firewall & network protection. Check for warning banners and find the ACTIVE network type. In this example, Public firewall is OFF. Contact IT if the active firewall is off; do not use Restore settings.","faAction":"بخش Firewall & network protection را باز کنید. هشدارها و نوع شبکه فعال را بررسی کنید. در این تصویر فایروال Public خاموش است. در صورت خاموش بودن فایروال فعال به IT اطلاع دهید؛ Restore settings را انتخاب نکنید.","optional":false},{"en":"Check the active firewall profile","fa":"بررسی فایروال شبکه فعال","img":6,"page":"Windows 11","action":"Select your active network profile (Public, Domain or Private). Note whether its firewall is On or Off. These examples show Public OFF and Domain/Private ON. Do not switch networks or change firewall settings.","faAction":"پروفایل شبکه فعال (Public، Domain یا Private) را بررسی کنید و روشن یا خاموش بودن فایروال را یادداشت کنید. در تصاویر Public خاموش و Domain/Private روشن است. شبکه یا تنظیمات فایروال را تغییر ندهید.","optional":false,"moreImgs":[{"img":6,"en":"Public network (active example)","fa":"شبکه Public"},{"img":4,"en":"Domain network","fa":"شبکه Domain"},{"img":5,"en":"Private network","fa":"شبکه Private"}]},{"en":"App & browser control","fa":"کنترل برنامه و مرورگر","img":7,"page":"Windows 11","action":"Open App & browser control. Check reputation-based protection for yellow warnings such as “Check apps and files is off”. Report warnings to IT; do not change security policy.","faAction":"App & browser control را باز کنید. هشدارهای زرد مثل «Check apps and files is off» را بررسی کنید. هشدارها را به IT گزارش دهید و تنظیمات امنیتی را تغییر ندهید.","optional":false},{"en":"Device security","fa":"امنیت دستگاه","img":8,"page":"Windows 11","action":"Open Device security. Review Core isolation, Secure Boot and Security processor. Note any red or yellow symbols, but do not change hardware security settings.","faAction":"Device security را باز کنید و Core isolation و Secure Boot و Security processor را بررسی کنید. نمادهای قرمز یا زرد را ثبت کنید اما تنظیمات امنیت سخت‌افزاری را تغییر ندهید.","optional":false},{"en":"Device performance & health","fa":"عملکرد و سلامت دستگاه","img":9,"page":"Windows 11","action":"Open Device performance & health. Read Health report and note warnings or recommendations (for example, Windows Time service). Do NOT select Fresh start.","faAction":"Device performance & health را باز کنید. Health report و هشدارهای آن مانند Windows Time service را بررسی کنید. گزینه Fresh start را انتخاب نکنید.","optional":false},{"en":"Family options (reference only)","fa":"گزینه‌های خانواده (فقط برای آشنایی)","img":10,"page":"Windows 11","action":"This screen is included from your supplied screenshots. No action is needed for a normal employee check. Select Done after you recognise this screen. Do not set up parental controls.","faAction":"این صفحه از تصاویر ارسالی شما قرار داده شده است. برای بررسی عادی کارمندان نیازی به اقدامی نیست. پس از مشاهده، گزینه Done را انتخاب کنید. کنترل والدین را فعال نکنید.","optional":false,"moreImgs":[{"img":10,"en":"Family options · original 1","fa":"Family options · تصویر ۱"},{"img":11,"en":"Family options · original 2","fa":"Family options · تصویر ۲"}]},{"en":"Protection history","fa":"سابقه حفاظت","img":12,"page":"Windows 11","action":"Open Protection history and review recent security events. The example shows firewall and real-time protection warnings plus blocked/quarantined threats. If a High or Severe threat appears on YOUR PC, contact IT immediately.","faAction":"Protection history را باز کنید و رویدادهای اخیر امنیتی را بررسی کنید. تصویر شامل هشدار فایروال و آنتی‌ویروس و تهدیدهای مسدودشده است. اگر روی سیستم شما تهدید High یا Severe دیده شد، فوراً به IT اطلاع دهید.","optional":false}],"images":{"0":"data:image/webp;base64,UklGRlihAABXRUJQVlA4TEyhAAAvegcaATWPI7dtJEle/v/prkpV92DuETEB/GiSUNueZP2BtZlvpu+4p+pYrwetWZcHbekXmXuPn9h2MTbeM8x6JfHpLrmv7StjffkkibiWiycIDZmkyiVKobkL5Lg3s+bTK8rWn6KllHXOd5JAp+44T67bNocLaJlb59xtSQ/ZHpyu2kKW/GBLnyw1H $('answers').innerHTML=vals.map(v=>`<button class="ans ${state.answers[state.index]===v?'selected':''}" aria-pressed="${state.answers[state.index]===v}" data-status="${v}"><span class="circle"></span>${escapeHtml(L(v,v==='Done'?'انجام شد':'قابل انجام نبود'))}</button>`).join('');const note=document.createElement('div');note.className='securityNote';note.dir=state.locale==='fa'?'rtl':'ltr';note.textContent=L('⚠ These screenshots show examples with protection OFF and security alerts. If your own PC shows red warnings, firewall off, or severe threats, contact IT promptly. Do NOT turn protections off/on, reset settings or use Fresh start.','⚠ این تصاویر شامل نمونه‌هایی از حفاظت خاموش و هشدار امنیتی هستند. اگر در دستگاه شما هشدار قرمز، فایروال خاموش یا تهدید شدید دیده می‌شود، سریعاً با IT تماس بگیرید. هیچ تنظیم امنیتی را تغییر ندهید.');$('answers').appendChild(note);
