const TASK_TEMPLATE=$('task').innerHTML;const I=DATA.images;const STEPS=DATA.steps;const storageKey='itready_'+DATA.kind+'_steps_v1';
let state={index:0,answers:{},locale:localStorage.getItem('itready_language')||'en'};
try{const old=JSON.parse(localStorage.getItem(storageKey));if(old&&typeof old==='object'){state.index=Math.min(Math.max(0,Number(old.index)||0),STEPS.length);state.answers=old.answers||{};}}catch(e){}
function save(){localStorage.setItem(storageKey,JSON.stringify({index:state.index,answers:state.answers}));localStorage.setItem('itready_language',state.locale)}
function L(en,fa){return state.locale==='fa'?fa:en}
function escapeHtml(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function report(){const lines=STEPS.map((s,i)=>`${i+1}. ${s.en}: ${state.answers[i]||'Not recorded'}`);return `${DATA.reportTitle}
Employee-verified results for IT review

${lines.join(String.fromCharCode(10))}

Report prepared using IT Ready.`}
function updateImage(){if(state.index>=STEPS.length)return;const st=STEPS[state.index];const src=I[String(st.img)];$('shot').src=src;$('shot').alt='Screenshot from the supplied guide: '+st.en;$('imageSource').textContent=L('Original guide screenshot · Page '+st.page,'تصویر اصلی راهنما · صفحه '+st.page);}
function render(){const isReport=state.index===STEPS.length;const total=STEPS.length;const st=isReport?null:STEPS[state.index];$('topTitle').textContent=L(DATA.title,DATA.faTitle);$('topSubtitle').textContent=L(DATA.sub,DATA.faSub);$('localeBtn').textContent=state.locale==='en'?'فارسی':'English';$('counter').textContent=(isReport?total:state.index+1)+' / '+total;$('progressFill').style.width=((isReport?1:(state.index+1)/total)*100)+'%';$('progressLabel').textContent=L(isReport?'Report ready':'Step '+(state.index+1)+' of '+total,isReport?'گزارش آماده است':'مرحله '+(state.index+1)+' از '+total);$('back').disabled=state.index===0;$('next').textContent=isReport?L('Start again','شروع دوباره'):state.index===total-1?L('View report →','مشاهده گزارش ←'):L('Next →','بعدی ←');$('next').disabled=!isReport&&!state.answers[state.index];
 if(isReport){$('visual').classList.add('hide');$('task').style.gridColumn='1 / -1';$('work').style.gridTemplateColumns='1fr';$('task').innerHTML=`<span class="stepTag">${L('FINAL SUMMARY','خلاصه نهایی')}</span><h2>${L('Ready for IT','آماده برای پشتیبانی')}</h2><p style="color:#657e9b;line-height:1.5">${L('Review and copy your completed steps. Nothing is sent automatically.','مراحل ثبت‌شده را بررسی و کپی کنید. هیچ اطلاعاتی خودکار ارسال نمی‌شود.')}</p><pre class="reportBox" id="reportText"></pre><div class="reportActions"><button id="copyReport">${L('Copy report','کپی گزارش')}</button><button id="saveReport" class="secondary">${L('Save text file','ذخیره فایل متنی')}</button></div>`;$('reportText').textContent=report();$('copyReport').onclick=copyReport;$('saveReport').onclick=()=>{const blob=new Blob([report()],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');const u=URL.createObjectURL(blob);a.href=u;a.download=`IT_Ready_${DATA.kind}_Report.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(u),800)}}else{if(!$('stepTag'))$('task').innerHTML=TASK_TEMPLATE;const opt=!!st.optional;$('visual').classList.remove('hide');$('work').style.gridTemplateColumns='';$('task').style.gridColumn='';$('stepTag').textContent=L('STEP ','مرحله ')+String(state.index+1).padStart(2,'0');$('stepTitle').textContent=L(st.en,st.fa);$('stepAction').textContent=L(st.action,st.faAction);$('stepAction').dir=state.locale==='fa'?'rtl':'ltr';$('optionalNote').classList.toggle('hide',!opt);$('optionalNote').textContent=L('Optional — do this only if needed.','اختیاری — فقط در صورت نیاز انجام دهید.');$('resultLabel').textContent=L('MARK YOUR RESULT','نتیجه را انتخاب کنید');const vals=['Done','Need IT help','Could not complete',...(opt?['Not needed']:[])];$('answers').innerHTML=vals.map(v=>`<button class="ans ${state.answers[state.index]===v?'selected':''}" data-status="${v}"><span class="circle"></span>${escapeHtml(L(v,v==='Done'?'انجام شد':v==='Need IT help'?'نیاز به کمک IT':v==='Could not complete'?'قابل انجام نبود':'نیازی نبود'))}</button>`).join('');$('answers').querySelectorAll('[data-status]').forEach(b=>b.addEventListener('click',()=>{state.answers[state.index]=b.dataset.status;save();render()}));updateImage();}
 $('next').style.visibility='visible';}
async function copyReport(){const t=report();try{await navigator.clipboard.writeText(t)}catch(err){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}$('copyReport').textContent=L('✓ Copied','✓ کپی شد')}
$('localeBtn').onclick=()=>{state.locale=state.locale==='en'?'fa':'en';save();render()};$('next').onclick=()=>{if(state.index===STEPS.length){if(!confirm(L('Clear this guide’s answers and start again?','پاسخ‌ها پاک شوند و از اول شروع شود؟')))return;state.index=0;state.answers={}}else{state.index++}save();render();window.scrollTo({top:0,behavior:'instant'})};$('back').onclick=()=>{state.index=Math.max(0,state.index-1);save();render();window.scrollTo({top:0,behavior:'instant'})};$('imageButton').onclick=()=>{$('largeImage').src=$('shot').src;$('lightbox').classList.add('show')};$('closeLight').onclick=()=>$('lightbox').classList.remove('show');$('lightbox').onclick=e=>{if(e.target.id==='lightbox')$('lightbox').classList.remove('show')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('lightbox').classList.remove('show')});render();
</script></body></html>
