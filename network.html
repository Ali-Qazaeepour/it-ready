<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102344"><title>Network & Connectivity · IT Ready</title><link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
:root{font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#19304e;background:#eff4fb}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden}button,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #73b3ff;outline-offset:2px}
.top{background:#102344;color:white;padding:12px clamp(15px,3vw,35px);display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px}.brand{font-size:18px;font-weight:850}.back{font-size:13px;border:1px solid #ffffff55;border-radius:10px;padding:9px 13px} .layout{height:calc(100dvh - 64px);min-height:440px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;padding:14px;max-width:1800px;margin:auto}.side,.stage{background:#fff;border:1px solid #dbe5f3;border-radius:18px;min-width:0;overflow:hidden}.side{display:flex;flex-direction:column;padding:17px 13px;gap:10px}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:#3675ce}.side h1{font-size:22px;letter-spacing:-.04em;line-height:1.15;margin:4px 3px 9px}.side p{font-size:12px;line-height:1.5;color:#637c9c;margin:0 3px 8px}.menu{display:grid;gap:7px}.choice{width:100%;border:1px solid #e0e9f5;text-align:left;border-radius:12px;background:#f7faff;color:#3d5b7e;font-weight:750;padding:12px 13px}.choice.active{background:#e9f2ff;color:#185bb9;border-color:#9cc5ff}.stepTools{min-height:0;display:flex;flex-direction:column;border-top:1px solid #e1eaf4;padding-top:13px;gap:9px}.stepTools label{font-size:11px;font-weight:850;letter-spacing:.06em;color:#667f9e;text-transform:uppercase}.stepTools select{max-width:100%;width:100%;padding:10px;border:1px solid #dbe5f3;border-radius:10px;background:white;color:#203c5c}.stepNav{display:flex;gap:7px}.stepNav button{flex:1;border:1px solid #dbe5f3;background:#f7faff;color:#255990;padding:10px 7px;border-radius:10px;font-size:12px;font-weight:800}.tip{font-size:11px;color:#7489a4;line-height:1.45;margin-top:auto;padding:8px 3px}.stage{display:flex;flex-direction:column;position:relative}.stagehead{padding:9px 14px;border-bottom:1px solid #e0e9f3;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:#617b9e;font-weight:750}.frame{display:block;width:100%;height:100%;border:0;background:#eff4fb}.frameholder{flex:1;min-height:0}.remove{height:100%;overflow:auto;padding:clamp(20px,4vw,45px)}.remove h2{font-size:clamp(24px,3vw,36px);letter-spacing:-.04em;margin:0 0 10px}.remove .lead{color:#637a95;line-height:1.6;max-width:720px}.remove ol{padding-left:22px;max-width:760px;line-height:1.65}.remove li{padding:9px 0}.warning{background:#fff5e8;border:1px solid #f2d4a8;border-radius:12px;color:#85521b;padding:14px 16px;max-width:760px;line-height:1.55}.hide{display:none!important}
@media(max-width:800px){.layout{height:calc(100dvh - 58px);min-height:420px;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);padding:9px;gap:9px}.top{min-height:58px}.side{padding:10px 12px;gap:5px;border-radius:13px}.side h1{font-size:18px;margin:1px 0 4px}.side p,.tip{display:none}.menu{display:flex;overflow-x:auto;gap:6px}.choice{flex:0 0 auto;width:auto;padding:9px 12px;font-size:12px}.stepTools{border:0;padding:4px 0 0;flex-direction:row;align-items:center}.stepTools label{display:none}.stepTools select{flex:1;min-width:0;padding:7px;font-size:12px}.stepNav{flex:0 0 auto}.stepNav button{padding:7px 9px}.stage{border-radius:13px}.stagehead{padding:8px 12px}.remove{padding:20px}}
/* Tighter, less repetitive workspace */
.side{padding:13px 12px;gap:7px}.side h1{font-size:19px;margin:3px 2px 5px}.side p{margin:0 2px 5px}.choice{padding:10px 12px;font-size:13px}.stepTools{gap:7px;padding-top:10px}.stagehead{min-height:35px}
</style></head><body>
<header class="top"><a class="brand" href="./index.html">IT Ready <span aria-hidden="true">/</span> Network & Connectivity</a><a class="back" href="./index.html">← All guides</a></header>
<div class="layout"><aside class="side"><span class="eyebrow">Visual help centre</span><h1>Network & Connectivity</h1><p>Choose a section or jump straight to the step you need.</p>
<nav class="menu" aria-label="Guide sections">
<button type="button" class="choice active" data-tab="guide">Network checks</button>

<button type="button" class="choice" data-tab="full">Full original guide</button></nav>
<div class="stepTools" id="stepTools"><label for="stepSelect">Jump to a step</label><select id="stepSelect" aria-label="Jump to a step"><option value="">Loading steps…</option></select><div class="stepNav"><button id="prev" type="button" aria-label="Previous step">←</button><button id="next" type="button" aria-label="Next step">→</button></div></div>
<div class="tip">Your existing guide answers stay in the original guide. Screenshots can be enlarged there.</div></aside>
<main class="stage"><div class="stagehead"><span id="stageTitle">Network & Connectivity · Interactive guide</span><span id="stepStatus">Select a step</span></div>
<div class="frameholder" id="frameholder"><iframe class="frame" id="guide" src="./network-full.html" title="Network & Connectivity step-by-step guide"></iframe></div>

</main></div>
<script>
const frame=document.getElementById('guide'),sel=document.getElementById('stepSelect'),status=document.getElementById('stepStatus'),tools=document.getElementById('stepTools'),holder=document.getElementById('frameholder');
let currentTab='guide',steps=[],lastIndex=-1;const $=id=>document.getElementById(id);
function doc(){try{return frame.contentDocument}catch(e){return null}}
function inner(expression){try{return frame.contentWindow.eval(expression)}catch(e){return null}}
function findSteps(){
const d=doc();if(!d)return;
let info=inner("typeof STEPS !== 'undefined' ? STEPS.map((x,i)=>({i,title:String(x.titleEn||x.title||x.name||x.label||x.heading||'Step '+(i+1))})) : null");
if(!Array.isArray(info)||!info.length){
const tabs=[...d.querySelectorAll('.stepTabs button,[role=tab],nav.stepTabs button')];
if(tabs.length)info=tabs.map((b,i)=>({i,title:(b.textContent||'Step '+(i+1)).trim()}));
}
if(!Array.isArray(info)||!info.length){info=[...d.querySelectorAll('main h2,main h3')].slice(0,35).map((h,i)=>({i,title:h.textContent.trim(),anchor:h.id})).filter(x=>x.title)}
steps=info;
sel.replaceChildren();
if(!steps.length){sel.add(new Option('Use guide navigation',''));return}
steps.forEach(s=>sel.add(new Option((s.i+1)+'. '+s.title.slice(0,75),String(s.i))));
refresh();
}
function refresh(){if(currentTab==='remove')return;let i=inner("typeof state !== 'undefined' && Number.isInteger(state.index) ? state.index : -1");if(!Number.isInteger(i)||i<0)i=-1;
if(i>=0&&i<steps.length){sel.value=String(i);status.textContent='Step '+(i+1)+' of '+steps.length;lastIndex=i}else if(steps.length){status.textContent=steps.length+' steps available';if(lastIndex>=0)sel.value=String(lastIndex)}else{status.textContent='Follow the guide below'}
}
function go(i){if(!Number.isInteger(i)||i<0||i>=steps.length)return;const d=doc();if(!d)return;
const tabs=[...d.querySelectorAll('.stepTabs button,[role=tab],nav.stepTabs button')];if(tabs[i]){tabs[i].click();refresh();return}
const worked=inner("typeof state !== 'undefined' && typeof render === 'function' ? (state.index="+i+", typeof save === 'function' && save(), render(), true) : false");
if(worked){refresh();return}
const h=d.querySelectorAll('main h2,main h3')[i];if(h)h.scrollIntoView({behavior:'smooth',block:'start'});
lastIndex=i;refresh()}
sel.addEventListener('change',()=>go(Number(sel.value)));
$('prev').onclick=()=>{let i=Number(sel.value);if(steps.length&&sel.value!=='')go(Math.max(0,i-1));else doc()?.getElementById('back')?.click()};
$('next').onclick=()=>{let i=Number(sel.value);if(steps.length&&sel.value!=='')go(Math.min(steps.length-1,i+1));else doc()?.getElementById('next')?.click()};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));const removed=currentTab==='remove';holder.classList.toggle('hide',removed);tools.classList.toggle('hide',removed||currentTab==='full');
$('stageTitle').textContent=removed?'Outlook Classic · Account removal':currentTab==='full'?'Full visual guide':'Network & Connectivity · Interactive guide';status.textContent=removed?'6 quick steps':currentTab==='full'?'Original content':'Choose a step';if(!removed)refresh()});
frame.addEventListener('load',()=>{const d=doc();if(!d)return;
const css=d.createElement('style');css.textContent=`html,body{max-width:100%;overflow-x:hidden}img{max-width:100%!important}.wrap{max-width:100%!important;padding-left:clamp(12px,2vw,26px)!important;padding-right:clamp(12px,2vw,26px)!important}.work{min-width:0}.visual,.task{min-width:0}.imageButton{max-height:min(55dvh,520px)!important;min-height:0!important}.imageButton img{max-height:min(51dvh,500px)!important;width:auto!important;height:auto!important;object-fit:contain!important}@media(max-width:850px){.work{grid-template-columns:1fr!important}.imageButton{max-height:43dvh!important}.imageButton img{max-height:40dvh!important}}`;d.head.appendChild(css);

// Remove the original embedded site header and redundant page title. The parent
// page owns navigation. Remove the redundant secondary scroll pane inside a step.
const cleanup=()=>{
for(const el of d.querySelectorAll('button,[role="radio"],[role="option"]')){
if(/^need\s+it\s+help$/i.test((el.textContent||'').trim()))el.remove();
}
};
const compact=d.createElement('style');
compact.textContent=`body>.top,body>header.top,header.top,.topinner,.pagelead{display:none!important}
html,body{overflow-x:hidden!important;height:auto!important}
.wrap,main.wrap{max-width:100%!important;padding:12px 15px 30px!important}
.progress{padding:9px 13px!important;margin-bottom:9px!important}
.work,.work.reportMode{height:auto!important;min-height:0!important;max-height:none!important;align-items:start!important}
.visual,.task{height:auto!important;min-height:0!important;max-height:none!important;overflow:visible!important}
.visual{display:block!important;padding:12px!important}
.task{padding:16px!important}
.task h2{font-size:clamp(20px,2vw,27px)!important;margin:6px 0 9px!important}
.instruction{font-size:13px!important;line-height:1.46!important;padding:11px 13px!important;margin-bottom:11px!important}
.answers{gap:7px!important}.ans{font-size:12px!important;min-height:39px!important;padding:8px 11px!important}
.securityNote{font-size:11px!important;padding:9px 11px!important}
.imageButton{height:auto!important;min-height:0!important;max-height:min(43dvh,400px)!important}
.imageButton img{height:auto!important;max-height:min(40dvh,380px)!important;width:auto!important;object-fit:contain!important}
.actions{position:static!important;margin:12px 0 5px!important}
@media(max-width:850px){.work{grid-template-columns:1fr!important}.imageButton{max-height:35dvh!important}.imageButton img{max-height:32dvh!important}}`;
d.head.appendChild(compact);cleanup();
findSteps();try{const observer=new MutationObserver(()=>{cleanup();refresh()});observer.observe(d.body,{subtree:true,childList:true,characterData:true});}catch(e){}
});
</script></body></html>
